<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Food Listing · FoodRescue</title>
  <meta name="description" content="FoodRescue connects surplus food donors with distributors in Bangalore.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <main class="app-main">
    <div class="page-head">
      <div><a href="/donor/listings.html" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> My Listings</a>
      <h1 class="mt-1" id="pageTitle">Add New Food Listing</h1></div>
    </div>
    <form id="listingForm" class="fr-card p-3 p-md-4" novalidate>
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="mb-3"><label class="form-label required" for="title">Food Name</label>
            <input class="form-control" id="title" name="title" placeholder="e.g., Vegetable Biryani" maxlength="100" required></div>
          <div class="mb-3"><label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" maxlength="1000" placeholder="Add a short description about the food (how it's packed, when it was cooked...)"></textarea></div>
          <div class="mb-3"><label class="form-label required" for="quantityPlates">Quantity (plates)</label>
            <input type="number" class="form-control" id="quantityPlates" name="quantityPlates" min="1" max="5000" step="1" placeholder="50" required></div>
          <div class="mb-3"><label class="form-label required d-block">Food Type</label>
            <div id="foodType"></div></div>
          <div class="mb-3"><label class="form-label required" for="area">Area (Bangalore)</label>
            <select class="form-select" id="area" name="area" required><option value="">Select area</option></select></div>
        </div>
        <div class="col-lg-5">
          <label class="form-label required">Food Photo</label>
          <label class="upload-box mb-3" id="uploadBox" for="image">
            <img id="preview" class="d-none" alt="Preview">
            <div id="uploadHint" class="p-3"><i class="bi bi-cloud-arrow-up fs-1 text-green"></i>
              <div class="fw-semibold">Upload Food Image</div>
              <div class="small text-muted">Click to upload or drag and drop<br>(JPG/PNG, max 5 MB · stored on Cloudinary)</div></div>
          </label>
          <input type="file" id="image" name="image" accept="image/*" class="d-none">
          <div class="mb-3"><label class="form-label required d-block">Price per plate</label><div id="price"></div>
            <div class="form-text">Only Free, ₹5 or ₹10 per plate are allowed.</div></div>
          <div class="mb-3"><label class="form-label required d-block">Kitchen Type</label><div id="kitchenType"></div></div>
          <div class="mb-3"><label class="form-label required" for="pickupDeadline">Pickup Deadline</label>
            <input type="datetime-local" class="form-control" id="pickupDeadline" name="pickupDeadline" required></div>
        </div>
      </div>
      <div class="alert alert-danger py-2 small d-none" id="error"></div>
      <div class="d-flex gap-2 justify-content-end">
        <a href="/donor/listings.html" class="btn btn-light px-4">Cancel</a>
        <button type="submit" class="btn btn-primary px-5" id="submitBtn">Create Listing</button>
      </div>
    </form>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
  requireRole('donor');
  const editId = qs('id');
  renderLayout('listings');

  const radios = (name, options, checked) => options.map(([value, label], i) =>
    `<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="${name}" id="${name}${i}" value="${value}" ${value === checked ? 'checked' : ''}>
     <label class="form-check-label" for="${name}${i}">${label}</label></div>`).join('');
  document.getElementById('foodType').innerHTML = radios('foodType', [['Pure Veg', 'Pure Veg'], ['Non-Veg', 'Non-Veg'], ['Mixed', 'Mixed']], 'Pure Veg');
  document.getElementById('kitchenType').innerHTML = radios('kitchenType', [['Vegetarian', 'Vegetarian'], ['Non-Vegetarian', 'Non-Vegetarian'], ['Mixed', 'Mixed']], 'Vegetarian');
  document.getElementById('price').innerHTML = radios('pricePerPlate', [['0', 'Free'], ['5', '₹5'], ['10', '₹10']], '0');
  document.getElementById('area').innerHTML += ['Koramangala', 'Indiranagar', 'Jayanagar', 'Whitefield'].map((a) => `<option>${a}</option>`).join('');
  const user = Auth.user;
  if (!editId && user.area && user.area !== 'All Bangalore') document.getElementById('area').value = user.area;

  // datetime-local wants local time "YYYY-MM-DDTHH:mm"
  const toLocalInput = (d) => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 16); };
  const deadline = document.getElementById('pickupDeadline');
  deadline.min = toLocalInput(new Date());
  if (!editId) deadline.value = toLocalInput(new Date(Date.now() + 4 * 3600 * 1000));

  // Image picker with preview + drag & drop
  const fileInput = document.getElementById('image');
  const box = document.getElementById('uploadBox');
  let file = null;
  function setFile(f) {
    if (!f) return;
    if (!f.type.startsWith('image/')) return toast('Please choose an image file.', 'danger');
    if (f.size > 5 * 1024 * 1024) return toast('Image must be 5 MB or smaller.', 'danger');
    file = f;
    const img = document.getElementById('preview');
    img.src = URL.createObjectURL(f);
    img.classList.remove('d-none');
    document.getElementById('uploadHint').classList.add('d-none');
  }
  fileInput.onchange = () => setFile(fileInput.files[0]);
  ['dragenter', 'dragover'].forEach((ev) => box.addEventListener(ev, (e) => { e.preventDefault(); box.classList.add('dragover'); }));
  ['dragleave', 'drop'].forEach((ev) => box.addEventListener(ev, (e) => { e.preventDefault(); box.classList.remove('dragover'); }));
  box.addEventListener('drop', (e) => setFile(e.dataTransfer.files[0]));

  // Edit mode: load the listing into the form
  if (editId) {
    document.getElementById('pageTitle').textContent = 'Edit Food Listing';
    document.getElementById('submitBtn').textContent = 'Save Changes';
    api('/listings/' + editId).then(({ listing: l }) => {
      if (l.status !== 'available') {
        toast(`This listing is ${l.status} and can't be edited.`, 'danger');
        return setTimeout(() => location.replace('/donor/listing.html?id=' + editId), 1200);
      }
      for (const k of ['title', 'description', 'quantityPlates', 'area']) document.getElementById(k).value = l[k];
      deadline.value = toLocalInput(l.pickupDeadline);
      document.querySelector(`[name=foodType][value="${l.foodType}"]`).checked = true;
      document.querySelector(`[name=kitchenType][value="${l.kitchenType}"]`).checked = true;
      document.querySelector(`[name=pricePerPlate][value="${l.pricePerPlate}"]`).checked = true;
      const img = document.getElementById('preview');
      img.src = l.imageUrl; img.classList.remove('d-none');
      document.getElementById('uploadHint').classList.add('d-none');
    }).catch((e) => toast(e.message, 'danger'));
  }

  document.getElementById('listingForm').onsubmit = async (e) => {
    e.preventDefault();
    const err = document.getElementById('error');
    err.classList.add('d-none');
    const v = (id) => document.getElementById(id).value.trim();
    const qty = Number(v('quantityPlates'));

    const problem = !v('title') ? 'Enter the food name.'
      : !Number.isInteger(qty) || qty < 1 ? 'Enter the quantity as a whole number of plates.'
      : !v('area') ? 'Choose an area.'
      : !deadline.value ? 'Choose a pickup deadline.'
      : new Date(deadline.value) <= new Date() ? 'Pickup deadline must be in the future.'
      : !editId && !file ? 'Please add a photo of the food.' : '';
    if (problem) { err.textContent = problem; err.classList.remove('d-none'); return; }

    const form = new FormData();
    form.append('title', v('title'));
    form.append('description', v('description'));
    form.append('quantityPlates', qty);
    form.append('area', v('area'));
    form.append('pickupDeadline', new Date(deadline.value).toISOString());
    for (const n of ['foodType', 'kitchenType', 'pricePerPlate']) form.append(n, document.querySelector(`[name=${n}]:checked`).value);
    if (file) form.append('image', file);

    await withBusy(e.submitter, async () => {
      try {
        const { listing } = await api(editId ? '/listings/' + editId : '/listings', { method: editId ? 'PUT' : 'POST', form });
        toast(editId ? 'Listing updated.' : 'Listing published! Distributors can see it now.');
        setTimeout(() => location.href = '/donor/listing.html?id=' + listing._id, 700);
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('d-none');
      }
    });
  };
</script>
</body>
</html>
