<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donor Dashboard · FoodRescue</title>
  <meta name="description" content="FoodRescue connects surplus food donors with distributors in Bangalore.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <main class="app-main">
    <div class="page-head">
      <div><h1>Dashboard</h1><p class="text-muted mb-0" id="welcome"></p></div>
      <a href="/donor/add-listing.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add Food</a>
    </div>
    <div class="row g-3 mb-4">
      <div class="col-6 col-xl-3"><div class="fr-card stat-card"><span class="stat-icon icon-green"><i class="bi bi-card-list"></i></span><div><div class="stat-value" id="sActive">–</div><div class="stat-label">Active Listings</div></div></div></div>
      <div class="col-6 col-xl-3"><div class="fr-card stat-card"><span class="stat-icon icon-orange"><i class="bi bi-hourglass-split"></i></span><div><div class="stat-value" id="sClaimed">–</div><div class="stat-label">Claimed</div></div></div></div>
      <div class="col-6 col-xl-3"><div class="fr-card stat-card"><span class="stat-icon icon-blue"><i class="bi bi-check2-circle"></i></span><div><div class="stat-value" id="sCompleted">–</div><div class="stat-label">Completed</div></div></div></div>
      <div class="col-6 col-xl-3"><div class="fr-card stat-card"><span class="stat-icon icon-red"><i class="bi bi-heart-fill"></i></span><div><div class="stat-value" id="sMeals">–</div><div class="stat-label">Meals Donated</div></div></div></div>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="section-title">Recent Listings</h2>
      <a href="/donor/listings.html" class="small">View All <i class="bi bi-arrow-right"></i></a>
    </div>
    <div id="recent">LOADING</div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/cards.js"></script>
<script>
  const user = requireRole('donor');
  renderLayout('dashboard');
  document.getElementById('welcome').textContent = `Welcome back, ${user.name.split(' ')[0]}!`;
  document.getElementById('recent').innerHTML = loadingState();

  api('/listings/mine').then(({ listings }) => {
    const count = (fn) => listings.filter(fn).length;
    document.getElementById('sActive').textContent = count((l) => l.status === 'available' && !isExpired(l));
    document.getElementById('sClaimed').textContent = count((l) => l.status === 'claimed');
    document.getElementById('sCompleted').textContent = count((l) => l.status === 'completed');
    document.getElementById('sMeals').textContent = fmtNum(listings.filter((l) => l.status === 'completed').reduce((s, l) => s + l.quantityPlates, 0));

    document.getElementById('recent').innerHTML = listings.length
      ? listings.slice(0, 5).map((l) => listingRow(l, l.status === 'available'
          ? `<a href="/donor/add-listing.html?id=${l._id}" class="btn btn-sm btn-outline-primary">Edit</a>`
          : `<a href="/donor/listing.html?id=${l._id}" class="btn btn-sm btn-light">View</a>`)).join('')
      : emptyState('basket', 'You have not posted any food yet.', '<a href="/donor/add-listing.html" class="btn btn-primary btn-sm">Post your first listing</a>');
  }).catch((e) => { document.getElementById('recent').innerHTML = emptyState('exclamation-circle', esc(e.message)); });
</script>
</body>
</html>
