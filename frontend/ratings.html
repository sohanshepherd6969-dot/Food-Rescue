<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Ratings · FoodRescue</title>
  <meta name="description" content="FoodRescue connects surplus food donors with distributors in Bangalore.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <main class="app-main">
    <div class="page-head"><div><h1 id="title">My Ratings</h1><p class="text-muted mb-0" id="sub"></p></div></div>
    <div class="row g-3 mb-4" id="stats"></div>
    <div class="row g-4" id="cols"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
  // Donor-only page: ratings distributors gave this donor after completed pickups.
  requireRole('donor');
  renderLayout('ratings');

  const stat = (icon, cls, value, label) => `<div class="col-sm-6 col-xl-4"><div class="fr-card stat-card"><span class="stat-icon ${cls}"><i class="bi bi-${icon}"></i></span>
    <div><div class="stat-value">${value}</div><div class="stat-label">${label}</div></div></div></div>`;
  const row = (r) => `<div class="fr-card p-3 mb-2 d-flex gap-3 align-items-start">
      ${imgTag(r.listingId?.imageUrl, 'food-thumb', '').replace('food-thumb', 'food-thumb" style="width:56px;height:56px')}
      <div class="flex-grow-1"><div class="d-flex justify-content-between flex-wrap gap-2">
        <b>${esc(r.reviewerId?.organizationName || r.reviewerId?.name || 'Unknown')}</b><span class="stars">${'★'.repeat(r.rating)}<span class="off">${'★'.repeat(5 - r.rating)}</span></span></div>
        <div class="food-meta">${esc(r.listingId?.title || '')} · ${fmtDate(r.createdAt, false)}</div>
        ${r.comment ? `<div class="small mt-1">“${esc(r.comment)}”</div>` : ''}</div></div>`;

  document.getElementById('sub').textContent = 'How distributors rated your food after each pickup. Your average is shown on your listings in the marketplace.';
  api('/reviews/mine').then(({ received, average }) => {
    document.getElementById('stats').innerHTML =
      stat('star-fill', 'icon-orange', average ? `${average.avg} / 5` : '–', 'Your average rating') +
      stat('chat-heart', 'icon-green', received.length, 'Ratings received');
    document.getElementById('cols').innerHTML = `<div class="col-lg-8"><h2 class="section-title mb-3">Ratings received</h2>
      ${received.length ? received.map(row).join('') : emptyState('star', 'No ratings yet. Distributors can rate you after a completed pickup.')}</div>`;
  }).catch((e) => toast(e.message, 'danger'));
</script>
</body>
</html>
