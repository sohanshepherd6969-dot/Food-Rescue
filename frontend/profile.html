<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · FoodRescue</title>
  <meta name="description" content="FoodRescue connects surplus food donors with distributors in Bangalore.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <main class="app-main">
    <div class="page-head"><h1>Profile</h1></div>
    <form id="profileForm" class="fr-card p-3 p-md-4" style="max-width:720px" novalidate>
      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="avatar" style="width:56px;height:56px;font-size:1.2rem" id="av"></div>
        <div><div class="fw-semibold fs-5" id="pName"></div><div class="text-muted small" id="pMeta"></div></div>
      </div>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label required" for="name">Full name</label><input class="form-control" id="name" maxlength="80" required></div>
        <div class="col-md-6"><label class="form-label" for="organizationName">Organization</label><input class="form-control" id="organizationName" maxlength="120"></div>
        <div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" id="email" disabled></div>
        <div class="col-md-6"><label class="form-label" for="phone">Phone</label><input class="form-control" id="phone" maxlength="15"></div>
        <div class="col-md-6"><label class="form-label" for="area">Area</label><select class="form-select" id="area"></select></div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn btn-light" onclick="logout()"><i class="bi bi-box-arrow-left me-1"></i>Logout</button>
        <button type="submit" class="btn btn-primary px-4">Save Changes</button>
      </div>
    </form>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
  requireRole('donor', 'distributor', 'admin');
  renderLayout('profile');
  document.getElementById('area').innerHTML = ['All Bangalore', 'Koramangala', 'Indiranagar', 'Jayanagar', 'Whitefield'].map((a) => `<option>${a}</option>`).join('');
  const FIELDS = ['name', 'organizationName', 'email', 'phone', 'area'];

  function fill(u) {
    FIELDS.forEach((f) => { document.getElementById(f).value = u[f] || (f === 'area' ? 'All Bangalore' : ''); });
    document.getElementById('av').textContent = initials(u.name);
    document.getElementById('pName').textContent = u.organizationName || u.name;
    document.getElementById('pMeta').textContent = `${ROLE_LABEL[u.role]} · member since ${fmtDate(u.createdAt, false)}`;
  }
  api('/auth/me').then(({ user }) => { fill(user); Auth.updateUser(user); }).catch((e) => toast(e.message, 'danger'));

  document.getElementById('profileForm').onsubmit = async (e) => {
    e.preventDefault();
    const body = Object.fromEntries(['name', 'organizationName', 'phone', 'area'].map((f) => [f, document.getElementById(f).value.trim()]));
    if (!body.name) return toast('Name cannot be empty.', 'danger');
    await withBusy(e.submitter, async () => {
      try {
        const { user } = await api('/auth/me', { method: 'PUT', body });
        Auth.updateUser(user);
        fill(user);
        toast('Profile saved.');
      } catch (ex) { toast(ex.message, 'danger'); }
    });
  };
</script>
</body>
</html>
