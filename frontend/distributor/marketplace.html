<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Food · FoodRescue</title>
  <meta name="description" content="FoodRescue connects surplus food donors with distributors in Bangalore.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <main class="app-main">
    <div class="page-head"><div><h1>Available Food in Bangalore</h1><p class="text-muted mb-0" id="resultCount">&nbsp;</p></div></div>
    <form id="filters" class="fr-card p-3 mb-4">
      <div class="input-group mb-3">
        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
        <input class="form-control" name="q" placeholder="Search food, donor, or area...">
      </div>
      <div class="row g-2 align-items-end">
        <div class="col-6 col-md-4 col-xl"><label class="form-label small mb-1">Area</label>
          <select class="form-select form-select-sm" name="area">
            <option value="All Bangalore">All Bangalore</option><option>Koramangala</option><option>Indiranagar</option><option>Jayanagar</option><option>Whitefield</option></select></div>
        <div class="col-6 col-md-4 col-xl"><label class="form-label small mb-1">Sort By</label>
          <select class="form-select form-select-sm" name="sort">
            <option value="newest">Newest first</option><option value="rating">Highest rated</option><option value="free">Free first</option><option value="price">Price: low to high</option></select></div>
        <div class="col-6 col-md-4 col-xl"><label class="form-label small mb-1">Price</label>
          <select class="form-select form-select-sm" name="price"><option value="all">All Prices</option><option value="free">Free only</option><option value="paid">Paid only</option></select></div>
        <div class="col-6 col-md-4 col-xl"><label class="form-label small mb-1">Food Type</label>
          <select class="form-select form-select-sm" name="foodType"><option value="All">All Types</option><option>Pure Veg</option><option>Non-Veg</option></select></div>
        <div class="col-6 col-md-4 col-xl"><label class="form-label small mb-1">Kitchen Type</label>
          <select class="form-select form-select-sm" name="kitchenType"><option value="Any">All Kitchens</option><option>Vegetarian</option><option>Non-Vegetarian</option><option>Mixed</option></select></div>
        <div class="col-6 col-md-4 col-xl-auto d-flex gap-2">
          <button class="btn btn-primary btn-sm flex-grow-1 px-4" type="submit">Search</button>
          <button class="btn btn-light btn-sm" type="button" id="reset" title="Clear filters"><i class="bi bi-arrow-counterclockwise"></i></button>
        </div>
      </div>
    </form>
    <div class="row g-3" id="grid"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/cards.js"></script>
<script>
  requireRole('distributor');
  renderLayout('browse');
  const form = document.getElementById('filters');
  const grid = document.getElementById('grid');

  // Filters live in the URL, so a filtered view can be refreshed or shared.
  const params = new URLSearchParams(location.search);
  for (const el of form.elements) if (el.name && params.has(el.name)) el.value = params.get(el.name);

  async function search() {
    const query = new URLSearchParams();
    for (const el of form.elements) if (el.name && el.value.trim()) query.set(el.name, el.value.trim());
    history.replaceState(null, '', '?' + query);
    grid.innerHTML = loadingState();
    try {
      const { listings } = await api('/listings?' + query);
      document.getElementById('resultCount').textContent = `${listings.length} listing${listings.length === 1 ? '' : 's'} found`;
      grid.innerHTML = listings.length ? listings.map(foodCard).join('')
        : `<div class="col-12">${emptyState('search', 'No food matches these filters. Try a different area or clear the filters.')}</div>`;
    } catch (e) {
      grid.innerHTML = `<div class="col-12">${emptyState('exclamation-circle', esc(e.message))}</div>`;
    }
  }

  form.onsubmit = (e) => { e.preventDefault(); search(); };
  form.querySelectorAll('select').forEach((s) => s.onchange = search); // dropdowns apply instantly
  document.getElementById('reset').onclick = () => { form.reset(); search(); };
  search();
</script>
</body>
</html>
