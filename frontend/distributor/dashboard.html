<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distributor Dashboard · FoodRescue</title>
  <meta name="description" content="FoodRescue connects surplus food donors with distributors in Bangalore.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <main class="app-main">
    <div class="page-head">
      <div><h1>Dashboard</h1><p class="text-muted mb-0" id="welcome"></p></div>
      <a href="/distributor/marketplace.html" class="btn btn-primary"><i class="bi bi-search me-1"></i>Browse Food</a>
    </div>
    <div class="row g-3 mb-4">
      <div class="col-6 col-xl-4"><div class="fr-card stat-card"><span class="stat-icon icon-orange"><i class="bi bi-truck"></i></span><div><div class="stat-value" id="sActive">–</div><div class="stat-label">Active Pickups</div></div></div></div>
      <div class="col-6 col-xl-4"><div class="fr-card stat-card"><span class="stat-icon icon-blue"><i class="bi bi-check2-circle"></i></span><div><div class="stat-value" id="sDone">–</div><div class="stat-label">Completed</div></div></div></div>
      <div class="col-6 col-xl-4"><div class="fr-card stat-card"><span class="stat-icon icon-green"><i class="bi bi-basket2"></i></span><div><div class="stat-value" id="sPlates">–</div><div class="stat-label">Plates Collected</div></div></div></div>
    </div>
    <div id="activeBox"></div>
    <div class="d-flex justify-content-between align-items-center mb-3 mt-2">
      <h2 class="section-title" id="freshTitle">Fresh listings</h2>
      <a href="/distributor/marketplace.html" class="small">See all <i class="bi bi-arrow-right"></i></a>
    </div>
    <div class="row g-3" id="fresh"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/cards.js"></script>
<script src="/js/pickups.js"></script>
<script>
  const user = requireRole('distributor');
  renderLayout('dashboard');
  document.getElementById('welcome').textContent = `Welcome back, ${user.name.split(' ')[0]}!`;
  document.getElementById('fresh').innerHTML = loadingState();

  function load() {
    api('/claims/mine').then(({ claims }) => {
      const active = claims.filter((c) => c.status === 'claimed');
      const done = claims.filter((c) => c.status === 'completed');
      document.getElementById('sActive').textContent = active.length;
      document.getElementById('sDone').textContent = done.length;
      document.getElementById('sPlates').textContent = fmtNum(done.reduce((s, c) => s + (c.listingId?.quantityPlates || 0), 0));
      document.getElementById('activeBox').innerHTML = active.length
        ? `<h2 class="section-title mb-3">Your active pickups</h2>${active.map((c) => claimCard(c, 'distributor')).join('')}` : '';
    });
  }
  bindClaimActions(document.getElementById('activeBox'), load);
  load();

  // Listings in the distributor's own area first (if they chose one).
  const area = user.area && user.area !== 'All Bangalore' ? user.area : '';
  if (area) document.getElementById('freshTitle').textContent = `Fresh listings in ${area}`;
  api('/listings?' + new URLSearchParams({ area, sort: 'newest' })).then(({ listings }) => {
    document.getElementById('fresh').innerHTML = listings.length ? listings.slice(0, 4).map(foodCard).join('')
      : `<div class="col-12">${emptyState('basket', 'No food available right now. Check back soon.')}</div>`;
  });
</script>
</body>
</html>
