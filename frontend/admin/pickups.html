<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickup Activity · FoodRescue</title>
  <meta name="description" content="FoodRescue connects surplus food donors with distributors in Bangalore.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <main class="app-main">
    <div class="page-head"><h1>Pickup Activity</h1>
      <select class="form-select w-auto" id="status"><option value="">All pickups</option><option value="claimed">Pending pickup</option><option value="completed">Collected</option><option value="cancelled">Cancelled</option></select></div>
    <div class="fr-card p-3"><div class="table-responsive"><table class="table mb-0">
      <thead><tr><th>Food</th><th>Donor</th><th>Distributor</th><th>Area</th><th>Plates</th><th>Claimed</th><th>Completed</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody></table></div></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
  requireRole('admin');
  renderLayout('pickups');
  const sel = document.getElementById('status');
  sel.value = qs('status') || '';

  async function load() {
    history.replaceState(null, '', sel.value ? '?status=' + sel.value : location.pathname);
    const rows = document.getElementById('rows');
    rows.innerHTML = `<tr><td colspan="8">${loadingState()}</td></tr>`;
    try {
      const { claims } = await api('/admin/claims' + (sel.value ? '?status=' + sel.value : ''));
      const name = (u) => esc(u?.organizationName || u?.name || '');
      rows.innerHTML = claims.map((c) => `<tr><td class="fw-medium">${esc(c.listingId?.title || '(deleted)')}</td>
        <td>${name(c.donorId)}</td><td>${name(c.distributorId)}</td><td>${esc(c.listingId?.area || '')}</td><td>${c.listingId?.quantityPlates ?? ''}</td>
        <td class="small text-nowrap">${fmtDate(c.claimedAt)}</td><td class="small text-nowrap">${c.completedAt ? fmtDate(c.completedAt) : '–'}</td><td>${claimBadge(c.status)}</td></tr>`).join('')
        || '<tr><td colspan="8" class="text-muted text-center py-4">No pickups yet.</td></tr>';
    } catch (e) { rows.innerHTML = `<tr><td colspan="8" class="text-danger">${esc(e.message)}</td></tr>`; }
  }
  sel.onchange = load;
  load();
</script>
</body>
</html>
