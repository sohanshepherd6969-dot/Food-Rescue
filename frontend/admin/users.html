<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Users · FoodRescue</title>
  <meta name="description" content="FoodRescue connects surplus food donors with distributors in Bangalore.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <main class="app-main">
    <div class="page-head"><h1>Manage Users</h1></div>
    <form class="fr-card p-3 mb-3 row g-2 mx-0" id="filters">
      <div class="col-md-6"><input class="form-control" name="q" placeholder="Search name, email or organization"></div>
      <div class="col-6 col-md-3"><select class="form-select" name="role"><option value="">All roles</option><option value="donor">Donors</option><option value="distributor">Distributors</option><option value="admin">Admins</option></select></div>
      <div class="col-6 col-md-3"><select class="form-select" name="status"><option value="">Any status</option><option value="active">Active</option><option value="suspended">Suspended</option></select></div>
    </form>
    <div class="fr-card p-3"><div class="table-responsive"><table class="table mb-0">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Area</th><th>Joined</th><th>Status</th><th class="text-end">Action</th></tr></thead>
      <tbody id="rows"></tbody></table></div></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
  requireRole('admin');
  renderLayout('users');
  const form = document.getElementById('filters');
  const rows = document.getElementById('rows');
  const p = new URLSearchParams(location.search);
  for (const el of form.elements) if (el.name && p.has(el.name)) el.value = p.get(el.name);

  async function load() {
    const q = new URLSearchParams([...new FormData(form)].filter(([, v]) => v));
    history.replaceState(null, '', '?' + q);
    rows.innerHTML = `<tr><td colspan="7">${loadingState()}</td></tr>`;
    try {
      const { users } = await api('/admin/users?' + q);
      rows.innerHTML = users.map((u) => `<tr>
        <td><div class="fw-medium">${esc(u.name)}</div><div class="small text-muted">${esc(u.organizationName || '')}</div></td>
        <td>${esc(u.email)}</td><td class="text-capitalize">${u.role}</td><td>${esc(u.area || '')}</td>
        <td class="text-nowrap">${fmtDate(u.createdAt, false)}</td><td>${statusBadge(u.status)}</td>
        <td class="text-end">${u.role === 'admin' ? '' : u.status === 'active'
          ? `<button class="btn btn-sm btn-outline-danger" data-id="${u.id}" data-status="suspended" data-name="${esc(u.name)}">Suspend</button>`
          : `<button class="btn btn-sm btn-outline-primary" data-id="${u.id}" data-status="active" data-name="${esc(u.name)}">Activate</button>`}</td></tr>`).join('')
        || '<tr><td colspan="7" class="text-muted text-center py-4">No users found.</td></tr>';
    } catch (e) { rows.innerHTML = `<tr><td colspan="7" class="text-danger">${esc(e.message)}</td></tr>`; }
  }

  rows.onclick = async (e) => {
    const b = e.target.closest('[data-status]');
    if (!b) return;
    const suspend = b.dataset.status === 'suspended';
    if (!(await confirmDialog(`${suspend ? 'Suspend' : 'Activate'} ${b.dataset.name}?`,
      suspend ? 'They will be logged out and cannot log in until re-activated.' : 'They will be able to log in again.',
      suspend ? 'Suspend' : 'Activate', suspend ? 'btn-danger' : 'btn-primary'))) return;
    try { await api(`/admin/users/${b.dataset.id}/status`, { method: 'PATCH', body: { status: b.dataset.status } }); toast('User updated.'); load(); }
    catch (ex) { toast(ex.message, 'danger'); }
  };

  let timer;
  form.oninput = () => { clearTimeout(timer); timer = setTimeout(load, 300); };
  form.onsubmit = (e) => { e.preventDefault(); load(); };
  load();
</script>
</body>
</html>
