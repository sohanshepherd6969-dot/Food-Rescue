<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard · FoodRescue</title>
  <meta name="description" content="FoodRescue connects surplus food donors with distributors in Bangalore.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <main class="app-main">
    <div class="page-head"><div><h1>Admin Dashboard</h1><p class="text-muted mb-0">Platform overview</p></div></div>
    <div class="row g-3 mb-4" id="stats"></div>
    <div class="row g-4 mb-4">
      <div class="col-lg-4"><div class="fr-card p-3 h-100"><h2 class="section-title mb-3">Listings by area</h2><div id="byArea"></div></div></div>
      <div class="col-lg-4"><div class="fr-card p-3 h-100"><h2 class="section-title mb-3">Listings by status</h2><div id="byStatus"></div></div></div>
      <div class="col-lg-4"><div class="fr-card p-3 h-100"><h2 class="section-title mb-3">Pickups by status</h2><div id="byClaim"></div></div></div>
    </div>
    <div class="fr-card p-3">
      <div class="d-flex justify-content-between align-items-center mb-2"><h2 class="section-title">Recent Listings</h2><a href="/admin/listings.html" class="small">Manage <i class="bi bi-arrow-right"></i></a></div>
      <div class="table-responsive"><table class="table mb-0">
        <thead><tr><th>Food</th><th>Donor</th><th>Area</th><th>Qty</th><th>Price</th><th>Status</th></tr></thead>
        <tbody id="recent"></tbody></table></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
  requireRole('admin');
  renderLayout('dashboard');

  const tile = (icon, cls, value, label, href) => `<div class="col-6 col-md-4 col-xl-2"><a href="${href}" class="text-reset text-decoration-none">
    <div class="fr-card stat-card"><span class="stat-icon ${cls}"><i class="bi bi-${icon}"></i></span>
    <div><div class="stat-value">${fmtNum(value)}</div><div class="stat-label">${label}</div></div></div></a></div>`;
  const bars = (obj, order) => {
    const keys = order || Object.keys(obj);
    const max = Math.max(1, ...keys.map((k) => obj[k] || 0));
    return keys.map((k) => `<div class="bar-row"><span class="text-truncate text-capitalize">${esc(k)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${((obj[k] || 0) / max) * 100}%"></div></div><b class="text-end">${obj[k] || 0}</b></div>`).join('');
  };

  api('/admin/stats').then((s) => {
    const t = s.totals;
    document.getElementById('stats').innerHTML =
      tile('people', 'icon-blue', t.users, 'Total Users', '/admin/users.html') +
      tile('basket2', 'icon-orange', t.donors, 'Donors', '/admin/users.html?role=donor') +
      tile('truck', 'icon-green', t.distributors, 'Distributors', '/admin/users.html?role=distributor') +
      tile('card-list', 'icon-green', t.listings, 'Total Listings', '/admin/listings.html') +
      tile('heart-fill', 'icon-red', t.mealsRescued, 'Meals Rescued', '/admin/pickups.html?status=completed') +
      tile('flag-fill', 'icon-red', t.openReports, 'Open Reports', '/admin/reports.html?status=open');
    document.getElementById('byArea').innerHTML = bars(s.listingsByArea, ['Koramangala', 'Indiranagar', 'Jayanagar', 'Whitefield']);
    document.getElementById('byStatus').innerHTML = bars(s.listingsByStatus, ['available', 'claimed', 'completed', 'cancelled', 'removed']);
    document.getElementById('byClaim').innerHTML = bars(s.claimsByStatus, ['claimed', 'completed', 'cancelled']);
  }).catch((e) => toast(e.message, 'danger'));

  api('/admin/listings').then(({ listings }) => {
    document.getElementById('recent').innerHTML = listings.slice(0, 8).map((l) => `<tr>
      <td class="fw-medium">${esc(l.title)}</td><td>${esc(l.donorId?.organizationName || l.donorId?.name || '')}</td>
      <td>${esc(l.area)}</td><td>${l.quantityPlates}</td><td>${fmtPrice(l.pricePerPlate)}</td><td>${statusBadge(l.status, l)}</td></tr>`).join('')
      || '<tr><td colspan="6" class="text-muted">No listings yet.</td></tr>';
  });
</script>
</body>
</html>
