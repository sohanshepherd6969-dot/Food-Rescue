<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Listings · FoodRescue</title>
  <meta name="description" content="FoodRescue connects surplus food donors with distributors in Bangalore.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <main class="app-main">
    <div class="page-head"><h1>Manage Listings</h1></div>
    <form class="fr-card p-3 mb-3 row g-2 mx-0" id="filters">
      <div class="col-md-6"><input class="form-control" name="q" placeholder="Search food or donor"></div>
      <div class="col-6 col-md-3"><select class="form-select" name="status"><option value="">All statuses</option>
        <option value="available">Available</option><option value="claimed">Claimed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option><option value="removed">Removed</option></select></div>
      <div class="col-6 col-md-3"><select class="form-select" name="area"><option value="">All areas</option><option>Koramangala</option><option>Indiranagar</option><option>Jayanagar</option><option>Whitefield</option></select></div>
    </form>
    <div class="fr-card p-3"><div class="table-responsive"><table class="table mb-0">
      <thead><tr><th>Food</th><th>Donor</th><th>Area</th><th>Qty</th><th>Price</th><th>Pickup by</th><th>Status</th><th class="text-end">Action</th></tr></thead>
      <tbody id="rows"></tbody></table></div></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
  requireRole('admin');
  renderLayout('listings');
  const form = document.getElementById('filters');
  const rows = document.getElementById('rows');
  const p = new URLSearchParams(location.search);
  for (const el of form.elements) if (el.name && p.has(el.name)) el.value = p.get(el.name);

  async function load() {
    const q = new URLSearchParams([...new FormData(form)].filter(([, v]) => v));
    history.replaceState(null, '', '?' + q);
    rows.innerHTML = `<tr><td colspan="8">${loadingState()}</td></tr>`;
    try {
      const { listings } = await api('/admin/listings?' + q);
      rows.innerHTML = listings.map((l) => `<tr>
        <td><div class="d-flex align-items-center gap-2">${imgTag(l.imageUrl, 'rounded', '').replace('<img', '<img width="44" height="36" style="object-fit:cover"')}<span class="fw-medium">${esc(l.title)}</span></div></td>
        <td>${esc(l.donorId?.organizationName || l.donorId?.name || '')}</td><td>${esc(l.area)}</td><td>${l.quantityPlates}</td>
        <td class="text-nowrap">${fmtPrice(l.pricePerPlate)}</td><td class="text-nowrap small">${fmtDate(l.pickupDeadline)}</td><td>${statusBadge(l.status, l)}</td>
        <td class="text-end text-nowrap"><button class="btn btn-sm btn-light" data-view="${l._id}">View</button>
          ${['available', 'claimed', 'cancelled'].includes(l.status) ? `<button class="btn btn-sm btn-outline-danger" data-remove="${l._id}" data-name="${esc(l.title)}">Remove</button>` : ''}</td></tr>`).join('')
        || '<tr><td colspan="8" class="text-muted text-center py-4">No listings found.</td></tr>';
    } catch (e) { rows.innerHTML = `<tr><td colspan="8" class="text-danger">${esc(e.message)}</td></tr>`; }
  }

  async function view(id) {
    const { listing: l } = await api('/listings/' + id);
    const claims = (l.claims || []).map((c) => `<li>${claimBadge(c.status)} ${esc(c.distributorId?.organizationName || c.distributorId?.name)} · claimed ${fmtDate(c.claimedAt)}</li>`).join('');
    await confirmDialog(l.title, `${imgTag(l.imageUrl, 'w-100 rounded-3 mb-3').replace('<img', '<img style="aspect-ratio:16/9;object-fit:cover"')}
      <div class="d-flex flex-wrap gap-1 mb-2">${typeBadges(l)} ${statusBadge(l.status, l)}</div>
      <p class="small mb-1"><b>Donor:</b> ${esc(l.donorId?.organizationName || l.donorId?.name)} ${l.donorId?.phone ? '· ' + esc(l.donorId.phone) : ''}</p>
      <p class="small mb-1"><b>Area:</b> ${esc(l.area)} · <b>Qty:</b> ${l.quantityPlates} plates · <b>Price:</b> ${fmtPrice(l.pricePerPlate)}</p>
      <p class="small mb-2"><b>Pickup by:</b> ${fmtDate(l.pickupDeadline)} · <b>Posted:</b> ${fmtDate(l.createdAt)}</p>
      <p class="small text-muted">${esc(l.description)}</p>
      ${claims ? `<b class="small">Pickups</b><ul class="small ps-3 mb-0">${claims}</ul>` : ''}`, 'Close');
  }

  rows.onclick = async (e) => {
    const v = e.target.closest('[data-view]');
    if (v) return view(v.dataset.view).catch((ex) => toast(ex.message, 'danger'));
    const r = e.target.closest('[data-remove]');
    if (!r) return;
    if (!(await confirmDialog(`Remove "${r.dataset.name}"?`, 'It disappears from the marketplace. An active pickup on it is cancelled.', 'Remove', 'btn-danger'))) return;
    try { await api(`/admin/listings/${r.dataset.remove}/remove`, { method: 'POST' }); toast('Listing removed.'); load(); }
    catch (ex) { toast(ex.message, 'danger'); }
  };

  let timer;
  form.oninput = () => { clearTimeout(timer); timer = setTimeout(load, 300); };
  form.onsubmit = (e) => { e.preventDefault(); load(); };
  load();
</script>
</body>
</html>
